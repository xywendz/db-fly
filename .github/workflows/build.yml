name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 允许在 Actions 标签发布时上传产物到 Release。
permissions:
  contents: write

jobs:
  # ---------- CLI：纯 Go，跨平台静态编译（CGO_ENABLED=0）----------
  cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          go build -trimpath \
            -ldflags "-s -w -X github.com/db-fly/db-fly/internal/cli.Version=${VERSION}" \
            -o "dist/dbctl${{ matrix.ext }}" ./cmd/dbctl
      - uses: actions/upload-artifact@v4
        with:
          name: dbctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/dbctl${{ matrix.ext }}
          if-no-files-found: error

  # ---------- Web 服务端：Vue 前端内嵌 Go 二进制（默认 linux/amd64）----------
  web-server:
    name: Web server (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:web
      - name: Copy assets into Go embed dir
        run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -r frontend/dist-web/. internal/webui/dist/
      - name: Build server
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/db-fly/db-fly/internal/bridge.Version=${VERSION}" \
            -o dist/db-fly-server ./cmd/db-fly-server
      - uses: actions/upload-artifact@v4
        with:
          name: db-fly-server-linux-amd64
          path: dist/db-fly-server
          if-no-files-found: error

  # ---------- 桌面 GUI：Windows exe（wails3 v3 纯 Go，需 wails3 CLI 生成图标）----------
  gui:
    name: GUI (windows/amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
        shell: bash
      - name: Build GUI
        shell: pwsh
        run: |
          ./build/gui.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: db-fly-gui-windows-amd64
          path: dist/db-fly-gui.exe
          if-no-files-found: error

  # ---------- 标签发布：把三份产物打包进 GitHub Release ----------
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, web-server, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release assets
        run: |
          cd artifacts
          for f in dbctl dbctl.exe db-fly-server db-fly-gui.exe; do
            [ -f "$f" ] && { gzip -kf "$f"; chmod +x "$f" 2>/dev/null || true; }
          done
          ls -la
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
