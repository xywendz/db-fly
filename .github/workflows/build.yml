name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 允许在 Actions 标签发布时上传产物到 Release。
permissions:
  contents: write

jobs:
 
  # ---------- Web 服务端：Vue 前端内嵌 Go 二进制（默认 linux/amd64）----------
  web-server:
    name: Web server (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:web
      - name: Copy assets into Go embed dir
        run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -r frontend/dist-web/. internal/webui/dist/
      - name: Build server
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/db-fly/db-fly/internal/bridge.Version=${VERSION}" \
            -o dist/db-fly-server ./cmd/db-fly-server
      - uses: actions/upload-artifact@v4
        with:
          name: db-fly-server-linux-amd64
          path: dist/db-fly-server
          if-no-files-found: error

  # ---------- 桌面 GUI：Windows exe + NSIS 安装包（wails3 v3 纯 Go）----------
  gui:
    name: GUI + installer (windows/amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
        shell: bash
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (Test-Path $nsisDir) {
            "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH += ";$nsisDir"
          }
          makensis /VERSION
      - name: Build GUI and installer
        shell: pwsh
        run: |
          ./build/gui.ps1
      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path dist/db-fly-setup-windows-amd64.exe)) {
            throw "Windows installer was not built"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: db-fly-gui-windows-amd64
          path: |
            dist/db-fly-gui.exe
            dist/db-fly-setup-windows-amd64.exe
          if-no-files-found: error

  # ---------- 标签发布：为每个平台只发布一份归档 ----------
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web-server, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release assets
        run: |
          cd artifacts
          # Drop any legacy gzip/raw artifacts so each platform ships one archive.
          rm -f ./*.gz ./checksums.txt

          if [ -f db-fly-server ]; then
            chmod +x db-fly-server 2>/dev/null || true
            tar -czf db-fly-server-linux-amd64.tar.gz db-fly-server
            rm -f db-fly-server
          fi

          # Wails updater unpacks .zip; a bare .gz cannot be swapped into place.
          # db-fly-setup-windows-amd64.exe is published as-is for first-time
          # installation; matchAsset never picks it up as an update package.
          if [ -f db-fly-gui.exe ]; then
            zip -j db-fly-gui-windows-amd64.zip db-fly-gui.exe
            rm -f db-fly-gui.exe
          fi

          # Digest sidecar consumed by the GUI's GitHub update provider.
          : > checksums.txt
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "checksums.txt" ] && continue
            sha256sum "$f" >> checksums.txt
          done
          ls -la
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
